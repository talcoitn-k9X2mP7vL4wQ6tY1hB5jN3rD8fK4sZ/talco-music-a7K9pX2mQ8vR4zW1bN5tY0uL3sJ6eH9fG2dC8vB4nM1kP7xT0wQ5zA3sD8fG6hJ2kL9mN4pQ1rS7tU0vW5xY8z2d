name: Déployer le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - name: Injecter les variables et générer sitemap.xml / robots.txt
        env:
          # Variables GitHub : Settings → Secrets and variables → Actions → Variables
          SITE_NAME: ${{ vars.SITE_NAME || 'TalcoMusic' }}
          SIGNUP_URL: ${{ vars.SIGNUP_URL }}                       # lien du bouton « Créer un compte » (à définir plus tard)
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}  # optionnel : code Search Console
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js icons _site/
          python3 - <<'PY'
          import os, re, json, html, pathlib, datetime
          name = os.environ["SITE_NAME"]
          url = os.environ["SITE_URL"].rstrip("/") + "/"
          signup = os.environ.get("SIGNUP_URL", "").strip()
          gsv = os.environ.get("GOOGLE_SITE_VERIFICATION", "").strip()
          esc = lambda v: html.escape(v, quote=True)
          jesc = lambda v: json.dumps(v, ensure_ascii=False)[1:-1].replace("</", "<\\/")

          p = pathlib.Path("_site/index.html")
          t = p.read_text(encoding="utf-8")
          if not gsv:  # pas de code Search Console : on retire la balise
              t = re.sub(r'[ \t]*<meta name="google-site-verification"[^>]*>\r?\n', "", t)
          for k, v in {
              "{{SITE_NAME_JSON}}": jesc(name),
              "{{SITE_NAME}}": esc(name),
              "{{SITE_URL}}": esc(url),
              "{{SIGNUP_URL}}": esc(signup),
              "{{GOOGLE_SITE_VERIFICATION}}": esc(gsv),
          }.items():
              t = t.replace(k, v)
          p.write_text(t, encoding="utf-8")

          m = pathlib.Path("_site/manifest.webmanifest")
          m.write_text(m.read_text(encoding="utf-8").replace("{{SITE_NAME}}", jesc(name)), encoding="utf-8")

          today = datetime.date.today().isoformat()
          pathlib.Path("_site/sitemap.xml").write_text(
              '<?xml version="1.0" encoding="UTF-8"?>\n'
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
              f'  <url><loc>{esc(url)}</loc><lastmod>{today}</lastmod></url>\n'
              '</urlset>\n', encoding="utf-8")
          pathlib.Path("_site/robots.txt").write_text(
              f"User-agent: *\nAllow: /\n\nSitemap: {url}sitemap.xml\n", encoding="utf-8")
          print("Nom :", name, "| URL :", url, "| inscription :", signup or "(non défini)")
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
